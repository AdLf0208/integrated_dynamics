[package]
# Port of Integrated Dynamics 1.38.2 (CyclopsMC/IntegratedDynamics, MIT).
# Minecraft Java 1.21.1 NeoForge; the port targets Horizon 26.3 at the pin in
# horizon-mod.toml. Clean-room Rust rewrite from the mod's behaviour
# (FINDINGS.md); local-only until publishing is approved, publishable under MIT
# with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "integrateddynamics"
version = "0.2.2"
edition = "2024"
license = "MIT"
description = "Integrated Dynamics for Horizon: a Logic Cable network carrying redstone and world-reader channels"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
