id = "integrateddynamics"
name = "Integrated Dynamics"
version = "0.2.2"
description = """A port of Integrated Dynamics for Horizon: a Logic Cable network whose parts carry a
redstone channel. A Redstone Reader samples the level of the block it faces into the connected
cable network, a World Reader samples the light, weather or day cycle there, and every Redstone
Writer on that network emits the channel from its own face. The variable-card layer, the machines
and the remaining part families are not ported yet."""
authors = ["rubensworks (aka kroeser)", "Horizon native mod contributors"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: an integrated server belongs to the client
# installation, so a LAN host or a single-player world needs both. A dedicated server is "server".
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"). This mod carries its cable, its part items and its chunk item, and the schema allows
# exactly this list, so it is not optional even when little is registered.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
